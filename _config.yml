# ------------------------------
# Jekyll Site Configuration
# ------------------------------

# Core identity
title: "Adam W. Lester"
description: "Professional site and portfolio for Adam W. Lester."
url: "https://adamwlester.github.io"     # GitHub Pages user domain
baseurl: "/awl-site"                     # Repo name (required for correct link resolution)

# Global profile data used by home layout + sidebar card
profile:
  name: "Adam W. Lester"
  avatar: "/assets/images/profile/awl-headshot.png"
  email: "adamwardlester@gmail.com"
  orcid: "https://orcid.org/0000-0002-4598-7908"

  # Role block
  role_title: "Postdoctoral Research Fellow"
  lab_label: "NC4 Lab"
  lab_url: "https://www.nc4.sbme.ubc.ca/"
  role_lines:
    - "School of Biomedical Engineering"
    - "University of British Columbia"
    - "Vancouver, BC, Canada"

  # Sidebar links (NC4 Lab handled in role block)
  links:
    - label: "LinkedIn"
      kind: "linkedin"
      url: "https://www.linkedin.com/in/adam-w-lester-34b97215"

    - label: "GitHub"
      kind: "github"
      url: "https://github.com/adamwlester"

    - label: "Google Scholar"
      kind: "scholar"
      url: "https://scholar.google.com/citations?user=hBawUaYAAAAJ"

    - label: "ResearchGate"
      kind: "researchgate"
      url: "https://www.researchgate.net"  # dummy link for now

    - label: "ORCID"
      kind: "orcid"
      url: "https://orcid.org/0000-0002-4598-7908"

# Markdown + HTML rendering
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false

# Collections (use default pages in /portfolio/projects)
# No custom collections needed for V1

# Permalinks: use clean folder-style output
permalink: pretty

# Default values for pages/posts
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Exclusions (not processed into the site build)
exclude:
  - README.md
  - README_assets/
  - .github/
  - .vscode/
  - .idea/
  - node_modules/
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - dev

# Plugins (keep minimal for GitHub Pages compatibility)
plugins: []

# Allow future-proofing for assets
sass:
  style: compressed
